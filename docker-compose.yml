# NexaWorks CSM Production Stack (SF-4)
# Stateful backing services: PostgreSQL 16, Redis 7, MinIO, ClamAV daemon
# Application services: Next.js web application and background worker
name: nexaworks-csm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/roles.sql:/opt/nexaworks/roles.sql:ro
      - ./docker/postgres/grants.sql:/opt/nexaworks/grants.sql:ro
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-nexaworks.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard rebuilds MinIO daily (D-31).
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  clamav:
    # ClamAV clamd daemon for malware scanning of file uploads (Q-18, ARCHITECTURE §7.6)
    image: clamav/clamav:stable_base
    # Upstream publishes amd64 only; pin it so Apple Silicon hosts run it under emulation.
    platform: linux/amd64
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3310 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    # Next.js 16 Production Web Application
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm start
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DATABASE_URL_MIGRATE: ${DATABASE_URL_MIGRATE:?set DATABASE_URL_MIGRATE in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      # Production refuses the log-only email and Slack transports (src/lib/config/env.ts).
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-resend}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      SLACK_DELIVERY: ${SLACK_DELIVERY:-live}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-nexaworks-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    restart: unless-stopped

  worker:
    # Background BullMQ worker process
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm exec tsx src/worker/index.ts
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DATABASE_URL_MIGRATE: ${DATABASE_URL_MIGRATE:?set DATABASE_URL_MIGRATE in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      # Production refuses the log-only email and Slack transports (src/lib/config/env.ts).
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-resend}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      SLACK_DELIVERY: ${SLACK_DELIVERY:-live}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-nexaworks-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  clamav-db:
